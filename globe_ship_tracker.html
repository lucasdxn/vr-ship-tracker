<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShipTrack Globe</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
:root {
  --color-bg: #0d0f14;
  --color-surface: #131720;
  --color-surface-2: #1a1f2e;
  --color-border: #2a2f42;
  --color-text: #e2e6f0;
  --color-text-muted: #7a8099;
  --color-primary: #3ea8ff;
  --color-primary-glow: rgba(62,168,255,0.18);
  --font-body: 'Inter', sans-serif;
  --radius-md: 8px;
  --radius-lg: 12px;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-6: 1.5rem;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--color-bg); font-family: var(--font-body, sans-serif); color: var(--color-text); -webkit-font-smoothing: antialiased; }

#app { display: grid; grid-template-columns: 1fr 280px; grid-template-rows: 48px 1fr; height: 100vh; }

header {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--space-6);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  z-index: 10;
}
.logo { display: flex; align-items: center; gap: var(--space-3); font-size: 0.9rem; font-weight: 600; letter-spacing: 0.04em; }
.logo svg { color: var(--color-primary); }
.header-stats { display: flex; gap: var(--space-6); }
.stat { font-size: 0.72rem; color: var(--color-text-muted); }
.stat span { color: var(--color-text); font-weight: 500; margin-left: 4px; }
.header-right { display: flex; align-items: center; gap: var(--space-3); }
.badge { background: rgba(62,168,255,0.12); color: var(--color-primary); border: 1px solid rgba(62,168,255,0.3); border-radius: 99px; padding: 2px 10px; font-size: 0.7rem; font-weight: 500; }

#globe-container {
  position: relative;
  background: radial-gradient(ellipse at 40% 40%, #0f1825 0%, #070a10 100%);
  overflow: hidden;
}
#globe-canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#globe-canvas:active { cursor: grabbing; }
.globe-overlay {
  position: absolute; bottom: var(--space-4); left: var(--space-4);
  display: flex; gap: var(--space-2);
}
.ctrl-btn {
  background: rgba(19,23,32,0.85); border: 1px solid var(--color-border);
  color: var(--color-text-muted); border-radius: var(--radius-md);
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 0.85rem; transition: all 0.15s ease;
  backdrop-filter: blur(8px);
}
.ctrl-btn:hover { color: var(--color-primary); border-color: rgba(62,168,255,0.4); }
.tooltip-box {
  position: absolute; display: none; background: rgba(13,15,20,0.92);
  border: 1px solid var(--color-border); border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4); font-size: 0.78rem; backdrop-filter: blur(12px);
  pointer-events: none; z-index: 20; min-width: 170px;
}
.tooltip-box .t-name { font-weight: 600; color: var(--color-text); margin-bottom: 4px; }
.tooltip-box .t-row { color: var(--color-text-muted); line-height: 1.6; }
.tooltip-box .t-row span { color: var(--color-text); }

#sidebar {
  background: var(--color-surface);
  border-left: 1px solid var(--color-border);
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.panel { padding: var(--space-4); border-bottom: 1px solid var(--color-border); }
.panel-title { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: var(--space-3); }

.ship-card {
  background: var(--color-surface-2); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); padding: var(--space-3);
  margin-bottom: var(--space-2); cursor: pointer; transition: all 0.15s ease;
}
.ship-card:hover { border-color: rgba(62,168,255,0.4); background: rgba(62,168,255,0.06); }
.ship-card-header { display: flex; align-items: center; gap: var(--space-2); margin-bottom: 6px; }
.ship-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ship-name { font-size: 0.82rem; font-weight: 600; flex: 1; }
.ship-status { font-size: 0.68rem; padding: 1px 7px; border-radius: 99px; font-weight: 500; }
.status-underway { background: rgba(62,255,154,0.12); color: #3eff9a; }
.status-anchored { background: rgba(255,184,62,0.12); color: #ffb83e; }
.status-docked { background: rgba(255,94,122,0.12); color: #ff5e7a; }
.ship-detail { font-size: 0.72rem; color: var(--color-text-muted); line-height: 1.7; }
.ship-detail span { color: var(--color-text); }

.form-row { margin-bottom: var(--space-3); }
.form-label { display: block; font-size: 0.72rem; color: var(--color-text-muted); margin-bottom: 4px; }
.form-input {
  width: 100%; background: var(--color-surface-2); border: 1px solid var(--color-border);
  color: var(--color-text); border-radius: var(--radius-md); padding: 6px 10px;
  font-size: 0.8rem; outline: none; transition: border-color 0.15s;
}
.form-input:focus { border-color: rgba(62,168,255,0.5); }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.btn-primary {
  width: 100%; background: var(--color-primary); color: #050810;
  border: none; border-radius: var(--radius-md); padding: 7px;
  font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.88; }
.btn-danger {
  background: rgba(255,94,122,0.12); color: #ff5e7a;
  border: 1px solid rgba(255,94,122,0.25); border-radius: var(--radius-md);
  padding: 3px 8px; font-size: 0.7rem; cursor: pointer; margin-top: 4px;
}

.log-entry { font-size: 0.72rem; color: var(--color-text-muted); padding: 3px 0; border-bottom: 1px solid rgba(42,47,66,0.4); line-height: 1.5; }
.log-entry span { color: var(--color-primary); }
#log-list { max-height: 140px; overflow-y: auto; }

.tabs { display: flex; gap: 2px; background: var(--color-surface-2); padding: 3px; border-radius: var(--radius-md); border: 1px solid var(--color-border); }
.tab-btn {
  flex: 1; background: transparent; border: none; color: var(--color-text-muted);
  padding: 6px 8px; font-size: 0.72rem; font-weight: 500; cursor: pointer;
  border-radius: 5px; transition: all 0.15s ease; letter-spacing: 0.03em;
}
.tab-btn:hover { color: var(--color-text); }
.tab-btn.active { background: rgba(62,168,255,0.15); color: var(--color-primary); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.filter-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); font-size: 0.74rem; color: var(--color-text-muted); }
.filter-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.filter-row input[type=checkbox] { accent-color: var(--color-primary); }
.range-row { display: flex; align-items: center; gap: var(--space-2); font-size: 0.74rem; color: var(--color-text-muted); }
.range-row input[type=range] { flex: 1; accent-color: var(--color-primary); }
.range-row .range-val { color: var(--color-text); font-weight: 500; min-width: 40px; text-align: right; }
.filter-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.filter-pill {
  background: rgba(62,168,255,0.12); color: var(--color-primary); border: 1px solid rgba(62,168,255,0.3);
  padding: 2px 8px; border-radius: 99px; font-size: 0.68rem; cursor: pointer;
}
.filter-pill .x { margin-left: 4px; color: rgba(255,255,255,0.6); }

.match-count { font-size: 0.7rem; color: var(--color-text-muted); margin-bottom: var(--space-3); }
.match-count span { color: var(--color-text); }
.empty-hint { font-size: 0.74rem; color: var(--color-text-muted); padding: var(--space-4) 0; text-align: center; line-height: 1.5; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 99px; }
</style>
</head>
<body>
<div id="app">

<header>
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
    </svg>
    ShipTrack Globe
  </div>
  <div class="header-stats">
    <div class="stat">VESSELS <span id="stat-total">0</span></div>
    <div class="stat">UNDERWAY <span id="stat-moving">0</span></div>
    <div class="stat">ANCHORED <span id="stat-anchored">0</span></div>
  </div>
  <div class="header-right">
    <div class="badge" id="live-badge">● LIVE</div>
  </div>
</header>

<div id="globe-container">
  <canvas id="globe-canvas"></canvas>
  <div class="globe-overlay">
    <button class="ctrl-btn" id="btn-rotate" title="Toggle auto-rotate" style="color:var(--color-primary)">&#8635;</button>
    <button class="ctrl-btn" id="btn-reset" title="Reset view">&#8962;</button>
    <button class="ctrl-btn" id="btn-trails" title="Toggle trails" style="color:var(--color-primary)">&#12316;</button>
  </div>
  <div class="tooltip-box" id="tooltip"></div>
</div>

<div id="sidebar">
  <div class="panel" style="padding-bottom: var(--space-3);">
    <div class="tabs">
      <button class="tab-btn active" data-tab="ships">Ships</button>
      <button class="tab-btn" data-tab="add">Add</button>
      <button class="tab-btn" data-tab="filters">Filters</button>
    </div>
  </div>

  <div class="panel tab-panel active" id="tab-ships">
    <div class="panel-title">Vessels <span style="float:right;text-transform:none;letter-spacing:0;color:var(--color-text-muted)" id="ship-list-count"></span></div>
    <div id="ship-list"></div>
  </div>

  <div class="panel tab-panel" id="tab-add">
    <div class="panel-title">Add Vessel</div>
    <div class="form-row">
      <label class="form-label">Name</label>
      <input class="form-input" id="f-name" placeholder="MV Atlantic Star" />
    </div>
    <div class="form-row form-row-2">
      <div><label class="form-label">Latitude</label><input class="form-input" id="f-lat" type="number" placeholder="0.0" min="-90" max="90"/></div>
      <div><label class="form-label">Longitude</label><input class="form-input" id="f-lon" type="number" placeholder="0.0" min="-180" max="180"/></div>
    </div>
    <div class="form-row form-row-2">
      <div><label class="form-label">Speed (kn)</label><input class="form-input" id="f-speed" type="number" placeholder="12" min="0" max="40"/></div>
      <div><label class="form-label">Heading (&deg;)</label><input class="form-input" id="f-hdg" type="number" placeholder="90" min="0" max="359"/></div>
    </div>
    <div class="form-row">
      <label class="form-label">Status</label>
      <select class="form-input" id="f-status">
        <option value="underway">Underway</option>
        <option value="anchored">Anchored</option>
        <option value="docked">Docked</option>
      </select>
    </div>
    <button class="btn-primary" id="btn-add">Add Vessel</button>
    <div style="display:flex; gap: var(--space-2); margin-top: var(--space-3);">
      <button class="btn-primary" id="btn-add-random" style="background: var(--color-surface-2); color: var(--color-text); border: 1px solid var(--color-border); flex:1;">+ Random</button>
      <button class="btn-primary" id="btn-add-random-10" style="background: var(--color-surface-2); color: var(--color-text); border: 1px solid var(--color-border); flex:1;">+ 10 Random</button>
    </div>
  </div>

  <div class="panel tab-panel" id="tab-filters">
    <div class="panel-title">Filters</div>
    <div class="match-count">Showing <span id="filter-count">0</span> of <span id="filter-total">0</span> vessels</div>

    <div class="form-row">
      <label class="form-label">Name search</label>
      <input class="form-input" id="filter-name" placeholder="match by name..." />
    </div>

    <div class="form-row">
      <label class="form-label">Flag (country)</label>
      <input class="form-input" id="filter-country" placeholder="e.g. Germany, Liberia" />
      <div style="font-size:0.66rem; color: var(--color-text-muted); margin-top: 4px; line-height:1.4;">
        Matches the country of the vessel's MMSI prefix (AIS ships only).
      </div>
      <div class="filter-pills" id="filter-country-pills"></div>
    </div>

    <div class="form-row">
      <label class="form-label">Status</label>
      <div class="filter-row"><label><input type="checkbox" id="filter-status-underway" checked> Underway</label></div>
      <div class="filter-row"><label><input type="checkbox" id="filter-status-anchored" checked> Anchored</label></div>
      <div class="filter-row"><label><input type="checkbox" id="filter-status-docked" checked> Docked</label></div>
    </div>

    <div class="form-row">
      <label class="form-label">Min speed</label>
      <div class="range-row">
        <input type="range" id="filter-min-speed" min="0" max="40" step="0.5" value="0">
        <span class="range-val" id="filter-min-speed-val">0 kn</span>
      </div>
    </div>

    <div class="form-row">
      <label class="form-label">Source</label>
      <select class="form-input" id="filter-source">
        <option value="all">All vessels</option>
        <option value="ais">AIS stream only</option>
        <option value="manual">Manually added only</option>
      </select>
    </div>

    <button class="btn-primary" id="btn-clear-filters" style="background: var(--color-surface-2); color: var(--color-text); border: 1px solid var(--color-border);">Clear all filters</button>
  </div>

  <div class="panel">
    <div class="panel-title">Event Log</div>
    <div id="log-list"></div>
  </div>
</div>
</div>

<script>
const COLORS = ['#3eff9a','#3ea8ff','#ffb83e','#ff5e7a','#c97bff','#ff9f3e','#3effee'];
let ships = [];
let nextId = 1;

const canvas = document.getElementById('globe-canvas');
const container = document.getElementById('globe-container');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

let rot = { x: 15, y: 0 };
let scale = 1;
let autoRotate = true;
let showTrails = true;
let pulse = 0;

let projection = null;
let pathGen = null;
let graticule = null;

function updateProjection() {
  const w = container.clientWidth, h = container.clientHeight;
  const r = Math.min(w, h) / 2 * 0.85 * scale;
  projection = d3.geoOrthographic()
    .scale(r)
    .translate([w/2, h/2])
    .rotate([rot.y, -rot.x, 0])
    .clipAngle(90);
  pathGen = d3.geoPath(projection, ctx);
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = container.clientWidth, h = container.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const LAND = [
  // North America
  [[-168,72],[-166,64],[-163,55],[-152,58],[-148,60],[-141,60],
   [-130,54],[-125,49],[-124,40],[-117,32],[-110,23],[-106,20],
   [-96,16],[-88,16],[-83,10],[-75,10],[-80,25],[-76,35],
   [-70,42],[-66,44],[-52,47],[-55,52],[-64,58],[-78,72],
   [-95,74],[-120,74],[-140,70],[-168,72]],
  // Greenland
  [[-44,60],[-42,65],[-22,72],[-18,77],[-24,82],[-44,83],
   [-58,83],[-58,76],[-46,70],[-44,60]],
  // South America
  [[-78,9],[-80,-2],[-80,-8],[-77,-14],[-75,-18],[-70,-22],
   [-68,-30],[-72,-38],[-75,-44],[-67,-55],[-58,-38],[-52,-33],
   [-44,-23],[-38,-15],[-35,-9],[-35,-5],[-48,-2],[-52,4],
   [-60,7],[-62,10],[-72,12],[-77,8],[-78,9]],
  // Europe
  [[-9,36],[-9,44],[-2,44],[3,44],[8,44],[12,44],[15,38],
   [18,40],[20,38],[24,38],[28,41],[30,46],[32,48],
   [30,50],[26,55],[20,54],[14,54],[8,55],[4,56],
   [0,51],[-5,48],[-9,44],[-9,36]],
  // Scandinavia
  [[5,57],[8,58],[5,62],[6,64],[14,66],[18,70],[25,71],
   [28,70],[30,70],[28,64],[28,60],[22,58],[18,56],
   [14,55],[10,55],[8,56],[5,57]],
  // UK & Ireland
  [[-6,50],[-3,50],[0,51],[2,52],[0,54],[-4,54],
   [-5,58],[-3,59],[-6,58],[-8,52],[-6,50]],
  // Africa
  [[-17,15],[-15,10],[-10,5],[2,5],[10,4],[15,2],
   [25,-4],[35,-10],[40,-15],[36,-20],[32,-25],[28,-30],
   [22,-34],[18,-33],[12,-30],[8,-25],[5,-15],[0,-5],
   [-5,0],[-10,3],[-15,5],[-17,15]],
  // Arabian Peninsula
  [[32,30],[36,22],[40,14],[44,12],[50,12],[58,22],
   [56,26],[50,26],[44,28],[40,30],[36,30],[32,30]],
  // Indian Subcontinent
  [[60,24],[68,24],[72,22],[76,8],[80,8],[82,14],
   [80,16],[80,20],[76,22],[72,22],[66,22],[62,28],[60,24]],
  // Asia (main)
  [[28,42],[42,42],[52,44],[60,44],[70,52],[90,50],[110,54],
   [120,55],[130,54],[136,52],[140,50],[140,44],[136,42],
   [130,40],[126,36],[122,32],[120,28],[116,22],[110,20],
   [106,12],[100,4],[92,18],[88,22],[80,12],[80,8],
   [72,20],[66,24],[62,26],[58,22],[56,24],[50,28],
   [48,30],[44,36],[40,38],[36,36],[28,42]],
  // Indochina & Malay Peninsula
  [[100,22],[104,18],[100,14],[100,8],[104,2],[106,4],
   [108,14],[102,22]],
  // Japan
  [[130,31],[132,34],[136,34],[138,36],[140,40],[142,44],
   [144,44],[142,40],[138,36],[134,34],[132,32],[130,31]],
  // Sumatra
  [[96,5],[100,2],[104,-2],[106,-5],[106,-2],[100,4],[96,5]],
  // Borneo
  [[108,2],[116,4],[118,4],[120,2],[118,-2],[112,-4],[108,0],[108,2]],
  // Australia
  [[114,-22],[118,-20],[122,-18],[128,-14],[132,-12],
   [136,-12],[138,-16],[140,-16],[142,-18],[144,-18],
   [148,-22],[152,-24],[154,-26],[152,-30],[148,-36],
   [144,-38],[140,-36],[138,-34],[132,-34],[126,-34],
   [120,-30],[116,-26],[114,-22]],
  // New Zealand N Island
  [[172,-34],[178,-38],[178,-36],[174,-36],[172,-34]],
  // New Zealand S Island
  [[166,-46],[170,-46],[172,-42],[170,-40],[166,-44],[166,-46]],
];

let landFeature = null;

async function loadLandData() {
  try {
    const res = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const topo = await res.json();
    landFeature = topojson.feature(topo, topo.objects.land);
  } catch(e) {
    console.warn('Land data fetch failed, using fallback:', e.message);
  }
}

function getLandFeature() {
  if (landFeature) return landFeature;
  return {
    type: 'Feature',
    geometry: { type: 'MultiPolygon', coordinates: LAND.map(ring => [ring]) }
  };
}

function drawGlobe() {
  updateProjection();
  const w = container.clientWidth, h = container.clientHeight;
  const r = Math.min(w, h) / 2 * 0.85 * scale;
  const cx = w/2, cy = h/2;
  ctx.clearRect(0, 0, w, h);

  // Atmosphere glow
  const grad = ctx.createRadialGradient(cx, cy, r * 0.98, cx, cy, r * 1.18);
  grad.addColorStop(0, 'rgba(62,168,255,0.22)');
  grad.addColorStop(1, 'rgba(62,168,255,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.18, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Ocean
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = '#0a1628';
  ctx.fill();

  // Graticule
  if (!graticule) graticule = d3.geoGraticule().step([20, 20]);
  ctx.beginPath();
  pathGen(graticule());
  ctx.strokeStyle = 'rgba(62,168,255,0.08)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Land
  ctx.beginPath();
  pathGen(getLandFeature());
  ctx.fillStyle = '#15263a';
  ctx.fill();
  ctx.strokeStyle = 'rgba(62,200,255,0.18)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Limb
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(62,168,255,0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawTrail(ship) {
  if (!showTrails || ship.trail.length < 2) return;
  ctx.beginPath();
  pathGen({ type: 'LineString', coordinates: ship.trail.map(p => [p.lon, p.lat]) });
  ctx.strokeStyle = ship.color;
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function isOnFrontHemisphere(lat, lon) {
  // Projection is centered on (lat = rot.x, lon = -rot.y). A point lies on
  // the visible hemisphere when its great-circle angular distance from that
  // center is <= 90°, i.e. the dot product of the two unit vectors is >= 0.
  const cLat = rot.x * Math.PI / 180;
  const cLon = -rot.y * Math.PI / 180;
  const sLat = lat * Math.PI / 180;
  const sLon = lon * Math.PI / 180;
  return Math.sin(cLat) * Math.sin(sLat) +
         Math.cos(cLat) * Math.cos(sLat) * Math.cos(sLon - cLon) >= 0;
}

function drawShip(ship) {
  if (!isOnFrontHemisphere(ship.lat, ship.lon)) return;
  const p = projection([ship.lon, ship.lat]);
  if (!p) return;
  const [x, y] = p;

  // Pulsing ring
  const ringR = 8 + 4 * pulse;
  ctx.beginPath();
  ctx.arc(x, y, ringR, 0, Math.PI*2);
  ctx.strokeStyle = ship.color;
  ctx.globalAlpha = 0.15 + 0.5 * (1 - pulse);
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Ship triangle (points in heading direction)
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ship.hdg * Math.PI / 180);
  ctx.fillStyle = ship.color;
  ctx.beginPath();
  ctx.moveTo(0, -7);
  ctx.lineTo(4.5, 5);
  ctx.lineTo(0, 2.5);
  ctx.lineTo(-4.5, 5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function draw() {
  drawGlobe();
  const visible = ships.filter(passesFilters);
  visible.forEach(drawTrail);
  visible.forEach(drawShip);
}

const DEG = Math.PI / 180;
function simulateShips(dt) {
  ships.forEach(ship => {
    if (ship.isAis) return; // AIS ships get real positions from the stream
    if (ship.status !== 'underway' || ship.speed === 0) return;
    const v = (ship.speed * 1852 / 111320) / 3600 * dt * 25;
    const dlat = Math.cos(ship.hdg * DEG) * v;
    const dlon = Math.sin(ship.hdg * DEG) * v / Math.max(0.1, Math.cos(ship.lat * DEG));
    ship.lat = Math.max(-85, Math.min(85, ship.lat + dlat));
    ship.lon = ((ship.lon + dlon + 540) % 360) - 180;
    ship.trail.push({ lat: ship.lat, lon: ship.lon });
    if (ship.trail.length > 80) ship.trail.shift();
  });
}

/* ============================================================ */
/* AIS ingestion via BroadcastChannel from ais_data_stream.html */
/* ============================================================ */
const AIS_STALE_MS = 10 * 60 * 1000;
let aisStreamActive = false;

function aisShipColor(sog) {
  if (sog == null || sog < 0.5) return '#7d8a96';
  const t = Math.min(1, sog / 20);
  const r = Math.round(0x37 + t * (0xD8 - 0x37));
  const g = Math.round(0x8A + t * (0x5A - 0x8A));
  const b = Math.round(0xDD + t * (0x30 - 0xDD));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function ingestAisShip(msg) {
  const id = 'ais-' + msg.mmsi;
  let ship = ships.find(s => s.id === id);
  const speed = msg.sog != null ? msg.sog : 0;
  const hdg = msg.cog != null ? msg.cog : 0;
  const status = speed > 0.5 ? 'underway' : 'anchored';
  const color = aisShipColor(speed);
  if (!ship) {
    ship = {
      id, isAis: true,
      name: msg.name || ('MMSI ' + msg.mmsi),
      lat: msg.lat, lon: msg.lon,
      speed, hdg, status, color,
      trail: [{ lat: msg.lat, lon: msg.lon }],
      lastUpdate: Date.now()
    };
    ships.push(ship);
  } else {
    ship.lat = msg.lat;
    ship.lon = msg.lon;
    ship.speed = speed;
    ship.hdg = hdg;
    ship.status = status;
    ship.color = color;
    if (msg.name) ship.name = msg.name;
    ship.trail.push({ lat: msg.lat, lon: msg.lon });
    if (ship.trail.length > 80) ship.trail.shift();
    ship.lastUpdate = Date.now();
  }
}

function pruneAisShips() {
  const now = Date.now();
  ships = ships.filter(s => !s.isAis || (now - (s.lastUpdate || 0)) <= AIS_STALE_MS);
}

const aisChannel = new BroadcastChannel('ais-stream');
aisChannel.addEventListener('message', ev => {
  const msg = ev.data || {};
  if (msg.type === 'position') {
    if (!aisStreamActive) { aisStreamActive = true; addLog('AIS stream connected'); }
    ingestAisShip(msg);
  } else if (msg.type === 'status') {
    if (msg.state === 'online' && !aisStreamActive) { aisStreamActive = true; addLog('AIS stream online'); }
    if (msg.state === 'offline' && aisStreamActive) { aisStreamActive = false; addLog('AIS stream offline'); }
  }
});
setInterval(pruneAisShips, 60 * 1000);

// Interaction
let drag = null;
canvas.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, rx: rot.x, ry: rot.y };
  autoRotate = false;
  document.getElementById('btn-rotate').style.color = '';
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    // Slow the drag at higher zoom so 1 px of drag ≈ 1 px of visible motion.
    const sens = 0.4 / Math.max(1, scale);
    rot.x = Math.max(-85, Math.min(85, drag.rx - dy * sens));
    rot.y = drag.ry + dx * sens;
  } else {
    checkHover(e);
  }
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('pointercancel', () => { drag = null; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (!projection) updateProjection();
  const before = projection.invert([mx, my]);

  // Exponential zoom: each wheel notch multiplies by ~1.15× (or 1/1.15 out).
  const factor = Math.exp(-e.deltaY * 0.0015);
  scale = Math.max(0.4, Math.min(25, scale * factor));
  updateProjection();

  // Zoom toward the cursor: if the cursor was on the globe, rotate the
  // projection so the same lat/lon ends up back under the cursor after zoom.
  // center_lon = -rot.y, center_lat = rot.x. Shifting center by (geo0 - geo1)
  // makes geo0 fall on the pixel where geo1 was after the scale change.
  if (before) {
    const after = projection.invert([mx, my]);
    if (after) {
      rot.y += after[0] - before[0];
      rot.x += before[1] - after[1];
      rot.x = Math.max(-85, Math.min(85, rot.x));
    }
  }
}, { passive: false });

function checkHover(e) {
  if (!projection) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  for (const ship of ships) {
    const p = projection([ship.lon, ship.lat]);
    if (!p) continue;
    if (Math.hypot(p[0] - mx, p[1] - my) < 14) {
      tooltip.style.display = 'block';
      tooltip.style.left = (mx + 14) + 'px';
      tooltip.style.top = (my - 10) + 'px';
      tooltip.innerHTML =
        '<div class="t-name">' + ship.name + '</div>' +
        '<div class="t-row">LAT <span>' + ship.lat.toFixed(2) + '</span> &nbsp; LON <span>' + ship.lon.toFixed(2) + '</span></div>' +
        '<div class="t-row">SPEED <span>' + ship.speed + ' kn</span> &nbsp; HDG <span>' + ship.hdg + '&deg;</span></div>' +
        '<div class="t-row">STATUS <span>' + ship.status.toUpperCase() + '</span></div>';
      return;
    }
  }
  tooltip.style.display = 'none';
}

document.getElementById('btn-rotate').addEventListener('click', () => {
  autoRotate = !autoRotate;
  document.getElementById('btn-rotate').style.color = autoRotate ? 'var(--color-primary)' : '';
});
document.getElementById('btn-reset').addEventListener('click', () => {
  rot = { x: 15, y: 0 };
  scale = 1;
});
document.getElementById('btn-trails').addEventListener('click', () => {
  showTrails = !showTrails;
  document.getElementById('btn-trails').style.color = showTrails ? 'var(--color-primary)' : '';
});

function renderSidebar() {
  const visible = ships.filter(passesFilters);
  const max = 150; // hard cap to keep DOM cheap when AIS pumps in thousands
  const slice = visible.slice(0, max);
  document.getElementById('ship-list').innerHTML = slice.map(s => {
    const idStr = JSON.stringify(String(s.id));
    const country = s.isAis ? (getCountryFromMMSI(String(s.id).replace(/^ais-/, '')) || '') : '';
    return '<div class="ship-card" onclick="focusShip(' + idStr + ')">' +
      '<div class="ship-card-header">' +
        '<div class="ship-dot" style="background:' + s.color + '"></div>' +
        '<div class="ship-name">' + escapeHtml(s.name) + '</div>' +
        '<div class="ship-status status-' + s.status + '">' + s.status + '</div>' +
      '</div>' +
      '<div class="ship-detail">' +
        'LAT <span>' + s.lat.toFixed(2) + '</span> &nbsp; LON <span>' + s.lon.toFixed(2) + '</span><br>' +
        'SPD <span>' + (s.speed != null ? (+s.speed).toFixed(1) : '0') + ' kn</span> &nbsp; HDG <span>' + Math.round(s.hdg || 0) + '&deg;</span>' +
        (country ? '<br>FLAG <span>' + escapeHtml(country) + '</span>' : '') +
        '<div style="margin-top:4px"><button class="btn-danger" onclick="event.stopPropagation();removeShip(' + idStr + ')">Remove</button></div>' +
      '</div>' +
    '</div>';
  }).join('') + (visible.length > max
    ? '<div class="empty-hint">…and ' + (visible.length - max) + ' more (apply tighter filters)</div>'
    : (visible.length === 0 ? '<div class="empty-hint">No vessels match the current filters.</div>' : ''));

  document.getElementById('ship-list-count').textContent = visible.length === ships.length
    ? ships.length
    : visible.length + ' / ' + ships.length;

  document.getElementById('stat-total').textContent = visible.length;
  document.getElementById('stat-moving').textContent = visible.filter(s => s.status === 'underway').length;
  document.getElementById('stat-anchored').textContent = visible.filter(s => s.status === 'anchored').length;
  document.getElementById('filter-count').textContent = visible.length;
  document.getElementById('filter-total').textContent = ships.length;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.focusShip = function(id) {
  const ship = ships.find(s => String(s.id) === String(id));
  if (!ship) return;
  rot.y = -ship.lon;
  rot.x = ship.lat;
  autoRotate = false;
  document.getElementById('btn-rotate').style.color = '';
  addLog('Focused on ' + ship.name);
};

window.removeShip = function(id) {
  const ship = ships.find(s => String(s.id) === String(id));
  if (ship) addLog('Removed vessel ' + ship.name);
  ships = ships.filter(s => String(s.id) !== String(id));
  renderSidebar();
};

document.getElementById('btn-add').addEventListener('click', () => {
  const name = document.getElementById('f-name').value.trim() || 'Vessel ' + nextId;
  const lat = parseFloat(document.getElementById('f-lat').value) || 0;
  const lon = parseFloat(document.getElementById('f-lon').value) || 0;
  const speed = parseFloat(document.getElementById('f-speed').value) || 0;
  const hdg = parseFloat(document.getElementById('f-hdg').value) || 0;
  const status = document.getElementById('f-status').value;
  const color = COLORS[nextId % COLORS.length];
  ships.push({ id: nextId++, name, lat, lon, speed, hdg, status, color, trail: [{lat, lon}] });
  renderSidebar();
  addLog('Added vessel ' + name);
  ['f-name','f-lat','f-lon','f-speed','f-hdg'].forEach(id => document.getElementById(id).value = '');
});

const logItems = [];
function addLog(msg) {
  const t = new Date().toTimeString().slice(0,8);
  logItems.unshift('<div class="log-entry"><span>' + t + '</span> ' + msg + '</div>');
  if (logItems.length > 20) logItems.pop();
  document.getElementById('log-list').innerHTML = logItems.join('');
}

let last = 0;
function animate(ts) {
  requestAnimationFrame(animate);
  const dt = Math.min((ts - last) / 1000, 0.1);
  last = ts;
  pulse = (Math.sin(ts / 500) + 1) / 2;
  if (autoRotate) rot.y += dt * 6;
  simulateShips(dt);
  draw();
}

/* ============================================================ */
/* Filters, tabs, MID-to-country lookup, random ship generator  */
/* ============================================================ */

const filters = {
  name: '',
  country: '',
  status: { underway: true, anchored: true, docked: true },
  minSpeed: 0,
  source: 'all'
};

function passesFilters(ship) {
  if (filters.source === 'ais' && !ship.isAis) return false;
  if (filters.source === 'manual' && ship.isAis) return false;
  if (!filters.status[ship.status]) return false;
  if ((ship.speed || 0) < filters.minSpeed) return false;
  if (filters.name && !String(ship.name || '').toLowerCase().includes(filters.name)) return false;
  if (filters.country) {
    if (!ship.isAis) return false;
    const mmsi = String(ship.id).replace(/^ais-/, '');
    const country = getCountryFromMMSI(mmsi);
    if (!country || !country.toLowerCase().includes(filters.country)) return false;
  }
  return true;
}

  if (!mmsi) return null;
  return MID_TO_COUNTRY[String(mmsi).slice(0, 3)] || null;
}

/* Popular-flags chips */
const POPULAR_FLAGS = ['Germany','Netherlands','United Kingdom','Norway','Greece','Italy','France','Spain','Panama','Liberia','Marshall Islands','Singapore','Malta','China','Japan','USA','Russia','Turkey'];

/* Random ship generators (for the Add tab) */
const RANDOM_NAMES = ['Atlantic','Pacific','Pioneer','Voyager','Polaris','Aurora','Mercury','Stellar','Mariner','Odyssey','Nautilus','Triton','Neptune','Helios','Tempest','Horizon','Phoenix','Endeavour'];
function addRandomShip() {
  const baseName = RANDOM_NAMES[Math.floor(Math.random() * RANDOM_NAMES.length)];
  const name = 'MV ' + baseName + '-' + nextId;
  const lat = Math.random() * 160 - 80;
  const lon = Math.random() * 360 - 180;
  const speed = Math.random() < 0.75 ? +(Math.random() * 22 + 1).toFixed(1) : 0;
  const hdg = Math.floor(Math.random() * 360);
  const status = speed > 0.5 ? 'underway' : (Math.random() < 0.5 ? 'anchored' : 'docked');
  const color = COLORS[nextId % COLORS.length];
  ships.push({ id: nextId++, name, lat, lon, speed, hdg, status, color, trail: [{lat, lon}] });
}
