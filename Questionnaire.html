<!DOCTYPE html>

<style>

</div></header>
<main id="app"></main>
<div class="nav noprint"><div class="inner">

</div></div>
<script>
const SUS_ANCHORS = ["strongly disagree","","","","strongly agree"];
const TRAIN = { "2D": '<li>You see a 2D world map in the browser.</li><li><b>Zoom/move:</b> right-click-drag or scroll to zoom, drag to pan; clicking a patch of water jumps there.</li><li>A <b>click on a ship</b> opens its <b>detail card</b> (name, type, speed, destination, length, status).</li><li><b>Routes/trails:</b> a trail is drawn behind moving ships — that is the route it has travelled (toggle in the panel).</li><li>Use the on-screen panel for filters, legend, course cones, density columns, and live/playback.</li>', "VR": '<li>Put on the headset with help from the facilitator; adjust it until the text is sharp.</li><li><b>Zoom:</b> grip (grab) and pull your hand toward you; alternatively push the left stick up/down.</li><li><b>Move:</b> the right stick moves you. The default is <b>teleport</b> (aim at a target, release); clicking the left stick toggles between teleport and fly. Turn in fixed steps by pushing the right stick sideways.</li><li><b>Select:</b> point the <b>trigger</b> at a ship or a patch of sea and press; clicking a ship opens its <b>detail card</b> (name, type, speed, destination, length, status).</li><li><b>Routes/trails:</b> a trail is drawn behind moving ships — that is the route it has travelled.</li><li>The <b>M</b> button (dead ahead, or X on the left controller) opens the in-scene menu: filters, legend, course cones, density columns, live/playback, save/restore view, recenter. Short vibrations confirm actions. Tell the facilitator immediately if you feel unwell.</li>' };
/* ---- SUS: 10 items, 5-point, odd positive / even negative (original English) ---- */
const SUS_ITEMS = [
  "I think that I would like to use this interface frequently.",
  "I found the interface unnecessarily complex.",
  "I thought the interface was easy to use.",
  "I think that I would need the support of a technical person to be able to use this interface.",
  "I found the various functions in this interface were well integrated.",
  "I thought there was too much inconsistency in this interface.",
  "I would imagine that most people would learn to use this interface very quickly.",
  "I found the interface very cumbersome to use.",
  "I felt very confident using the interface.",
  "I needed to learn a lot of things before I could get going with this interface."
];

/* ---- UEQ+ : three scales x 4 semantic differentials, 7-point (English) ---- */
const UEQP = {
  Efficiency:  [["slow","fast"],["inefficient","efficient"],["impractical","practical"],["cluttered","organized"]],
  Perspicuity: [["not understandable","understandable"],["difficult to learn","easy to learn"],["complicated","easy"],["confusing","clear"]],
  Stimulation: [["boring","exciting"],["not interesting","interesting"],["demotivating","motivating"],["dull","captivating"]]
};

/* ---- NASA-TLX (raw/unweighted): 6 subscales, 21-point (0..100 in steps of 5) ---- */
const TLX = [
  ["Mental Demand","How mentally demanding was the task?","Very low","Very high"],
  ["Physical Demand","How physically demanding was the task?","Very low","Very high"],
  ["Temporal Demand","How hurried or rushed was the pace of the task?","Very low","Very high"],
  ["Performance","How successful were you in accomplishing what you were asked to do?","Perfect","Failure"],
  ["Effort","How hard did you have to work to accomplish your level of performance?","Very low","Very high"],
  ["Frustration","How insecure, discouraged, irritated, stressed and annoyed were you?","Very low","Very high"]
];

/* ---- IPQ: 14 items, 7-point (0..6). SP2,SP3,INV3 reverse-keyed. (English) ---- */
const IPQ = [
  ["G1","In the computer-generated world I had a sense of \"being there\".","not at all","very much"],
  ["SP1","Somehow I felt that the virtual world surrounded me.","fully disagree","fully agree"],
  ["SP2","I felt like I was just perceiving pictures.","fully disagree","fully agree",true],
  ["SP3","I did not feel present in the virtual space.","did not feel present","felt present",true],
  ["SP4","I had a sense of acting in the virtual space rather than operating something from outside.","fully disagree","fully agree"],
  ["SP5","I felt present in the virtual space.","fully disagree","fully agree"],
  ["INV1","How aware were you of the real world surrounding you while navigating the virtual world?","very aware","not aware"],
  ["INV2","I was not aware of my real environment.","fully disagree","fully agree"],
  ["INV3","I still paid attention to the real environment.","fully disagree","fully agree",true],
  ["INV4","I was completely captivated by the virtual world.","fully disagree","fully agree"],
  ["REAL1","How real did the virtual world seem to you? (compared to an imagined world)","not real","completely real"],
  ["REAL2","How consistent was your experience in the virtual environment with your real-world experience?","not consistent","very consistent"],
  ["REAL3","How real did the virtual world seem to you? (like a real photograph)","not real","completely real"],
  ["REAL4","The virtual world seemed more realistic than the real world.","fully disagree","fully agree"]
];
const IPQ_REVERSE = ["SP2","SP3","INV3"];

/* ---- Tasks (fixed ships from the AIS feed, 2026-09-14 15:00 UTC) ----
   answerType: "text" | "number" | "choice2"(A/B).
   Per-condition timer; the answer is stored and automatically checked
   against the solution in the evaluation. */
const TASKS = [
  {
    id:"A1", title:"Find a ship and read a value",
    instruction:"Find the ship <b>BURRARD CHINOOK</b> (use the finder/search function if helpful). Open its detail card (click it in 2D, or select it with the trigger in VR) and read its current <b>speed in knots</b>.",
    answerLabel:"Speed of the BURRARD CHINOOK (in knots)",
    answerType:"number",
    solution:{ type:"number", value:12.1, tol:1.0 },
    note:"Locate. Target: BURRARD CHINOOK (MMSI 316042365), passenger ferry, Vancouver Harbour."
  },
  {
    id:"A2", title:"Follow a route",
    instruction:"Find the ship <b>EIDSVAAG SIRIUS</b> — it is sailing at high northern latitudes, north of Iceland. Follow its displayed route (trail) and, using its detail card, determine which <b>destination port</b> it is heading for.",
    answerLabel:"Destination port of the EIDSVAAG SIRIUS",
    answerType:"text",
    solution:{ type:"text", value:"ISAFJORD", accept:["isafjord","isafjordur","isafjordhur","isafjörður","ísafjörður"] },
    note:"Follow at high latitude. Target: EIDSVAAG SIRIUS (MMSI 257414000), cargo, dest ISAFJORD, lat 66.5. Plain-English 'Isafjord' accepted."
  },
  {
    id:"A3", title:"Compare two ships",
    instruction:"Compare the two ships <b>A = NORDLICHT II</b> and <b>B = STIENE BRUHNS</b> (both off the German North Sea coast, near Emden). Determine <b>which one is faster</b>, and also give the approximate <b>speed difference in knots</b>.",
    answerLabel:"Faster ship",
    answerType:"choice2",
    answerLabel2:"Approximate speed difference (knots)",
    answerType2:"number",
    solution:{ type:"choice2", value:"A", diff:27.2, difftol:6 },
    note:"Compare. A=NORDLICHT II (29.4kn, MMSI 211585990), B=STIENE BRUHNS (2.2kn, MMSI 211671890). diff~27kn."
  }
];

function likert(name,n,anchors){
  let s='<div class="scale">';
  for(let v=1;v<=n;v++){
    const a = anchors && anchors[v-1] ? `<br><span class="small">${anchors[v-1]}</span>`:"";
    s+=`<label><input type="radio" name="${name}" value="${v}"><span>${v}</span>${a}</label>`;
  }
  return s+'</div>';
}
function semantic(name){ // 7-point, value 1..7
  let s='<div class="scale">';
  for(let v=1;v<=7;v++) s+=`<label><input type="radio" name="${name}" value="${v}"><span>${v}</span></label>`;
  return s+'</div>';
}
function tlxScale(name){ // 0..100 step 5 shown as 21 ticks 0..20 -> store 0..100
  let s='<div class="scale">';
  for(let t=0;t<=20;t++){ const val=t*5; s+=`<label style="min-width:34px"><input type="radio" name="${name}" value="${val}"><span>${t%4===0?val:"·"}</span></label>`; }
  return s+'</div>';
}
function ipqScale(name){ // 0..6
  let s='<div class="scale">';
  for(let v=0;v<=6;v++) s+=`<label><input type="radio" name="${name}" value="${v}"><span>${v}</span></label>`;
  return s+'</div>';
}
function forced(key){
  return `<div class="choice" id="cmp-${key}">
    <label><input type="radio" name="cmp-${key}" value="2D"> 2D map</label>
    <label><input type="radio" name="cmp-${key}" value="VR"> VR globe</label>
  </div><div class="missmsg" id="miss-cmp-${key}">Please choose one.</div>`;
}

function susScore(items){ // Brooke 1996: odd (i even index) -> x-1 ; even -> 5-x ; sum*2.5
  let sum=0;
  for(let i=0;i<10;i++){ const x=items[i]; if(x==null) return null;
    sum += (i%2===0) ? (x-1) : (5-x); }
  return +(sum*2.5).toFixed(1); // 0..100
}
function ueqpScaleFor(cond,scale){
  let arr=[];
  for(let i=0;i<4;i++){ const v=state.cond[cond].ueqp[`${scale}-${i}`]; if(v==null) return null; arr.push(v-4); } // 1..7 -> -3..3
  return +(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(2);
}
function tlxRaw(vals){ // mean of six 0..100 subscales (raw/unweighted TLX, Hart 2006).
  // All six subscales are anchored so that higher = more workload; the Performance item is
  // anchored Perfect(0) -> Failure(100), so no reversal is applied. Overall score = simple mean.
  let arr=[];
  for(let i=0;i<6;i++){ let v=vals[i]; if(v==null) return null; arr.push(v); }
  return +(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1);
}
function ipqScores(vals){
  const g = vals["G1"];
  const rev = x => 6 - x;
  const sp = ["SP1","SP2","SP3","SP4","SP5"].map(k=> IPQ_REVERSE.includes(k)?rev(vals[k]):vals[k]);
  const inv= ["INV1","INV2","INV3","INV4"].map(k=> IPQ_REVERSE.includes(k)?rev(vals[k]):vals[k]);
  const real=["REAL1","REAL2","REAL3","REAL4"].map(k=>vals[k]);
  const mean=a=>a.some(x=>x==null)?null:+(a.reduce((s,x)=>s+x,0)/a.length).toFixed(2);
  return { General:g==null?null:g, SpatialPresence:mean(sp), Involvement:mean(inv), Realism:mean(real) };
}

/* ============================================================
   STATISTICS  (small-sample within-subjects)
   All routines are self-contained (no external libraries).
   Methods follow the analysis plan: descriptives + median/IQR,
   paired t OR Wilcoxon signed-rank chosen per symmetry, effect
   sizes (Cohen's dz / rank-biserial), BCa bootstrap CIs, and an
   exact binomial sign test for forced-choice preferences.
   ============================================================ */

/* ---------- basic descriptives ---------- */
function mean(a){ a=a.filter(isNum); return a.length? a.reduce((s,x)=>s+x,0)/a.length : null; }
function sd(a){ a=a.filter(isNum); if(a.length<2) return null; const m=mean(a);
  return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1)); }
function quantile(a,p){ a=a.filter(isNum).slice().sort((x,y)=>x-y); if(!a.length) return null;
  const idx=(a.length-1)*p, lo=Math.floor(idx), hi=Math.ceil(idx);
  if(lo===hi) return a[lo]; return a[lo]+(a[hi]-a[lo])*(idx-lo); }
function median(a){ return quantile(a,0.5); }
function iqr(a){ const q1=quantile(a,0.25), q3=quantile(a,0.75); return (q1==null||q3==null)?null:q3-q1; }
function isNum(x){ return typeof x==="number" && !isNaN(x); }
function round(x,d){ if(x==null||isNaN(x)) return null; const f=Math.pow(10,d==null?2:d); return Math.round(x*f)/f; }

/* ---------- normal & t distributions ---------- */
function normCDF(z){ // Abramowitz-Stegun
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989423*Math.exp(-z*z/2);
  let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0 ? 1-p : p;
}
function tCDF(t,df){ // via incomplete beta
  const x=df/(df+t*t);
  let ib=betai(df/2,0.5,x);
  let p=0.5*ib;
  return t>0 ? 1-p : p;
}
function betai(a,b,x){ if(x<=0)return 0; if(x>=1)return 1;
  const bt=Math.exp(gammaln(a+b)-gammaln(a)-gammaln(b)+a*Math.log(x)+b*Math.log(1-x));
  if(x<(a+1)/(a+b+2)) return bt*betacf(a,b,x)/a;
  return 1-bt*betacf(b,a,1-x)/b;
}
function betacf(a,b,x){ const MAXIT=200, EPS=3e-12, FPMIN=1e-300;
  let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;
  if(Math.abs(d)<FPMIN)d=FPMIN; d=1/d; let h=d;
  for(let m=1;m<=MAXIT;m++){ let m2=2*m;
    let aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d; if(Math.abs(d)<FPMIN)d=FPMIN;
    c=1+aa/c; if(Math.abs(c)<FPMIN)c=FPMIN; d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<FPMIN)d=FPMIN;
    c=1+aa/c; if(Math.abs(c)<FPMIN)c=FPMIN; d=1/d; let del=d*c; h*=del;
    if(Math.abs(del-1)<EPS) break; }
  return h;
}
function gammaln(x){ const c=[76.18009172947146,-86.50532032941677,24.01409824083091,
  -1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x,t=x+5.5; t-=(x+0.5)*Math.log(t); let s=1.000000000190015;
  for(let j=0;j<6;j++){ y++; s+=c[j]/y; } return -t+Math.log(2.5066282746310005*s/x); }

/* ---------- paired t-test ---------- */
function pairedT(d){ d=d.filter(isNum); const n=d.length; if(n<2) return null;
  const m=mean(d), s=sd(d); if(s===0) return {n,t:null,df:n-1,p:null,mean:m,sd:s};
  const t=m/(s/Math.sqrt(n)); const p=2*(1-tCDF(Math.abs(t),n-1));
  return {n,t,df:n-1,p,mean:m,sd:s}; }

/* Cohen's dz for paired data */
function cohenDz(d){ d=d.filter(isNum); const m=mean(d), s=sd(d); return (s&&s!==0)? m/s : null; }

/* ---------- Wilcoxon signed-rank (exact for small n, normal approx w/ ties otherwise) ---------- */
function wilcoxon(d){ d=d.filter(x=>isNum(x)&&x!==0); const n=d.length; if(n<1) return null;
  const abs=d.map(x=>Math.abs(x));
  // rank absolute values (average ranks for ties)
  const order=abs.map((v,i)=>[v,i]).sort((a,b)=>a[0]-b[0]);
  const ranks=new Array(n);
  let i=0; while(i<n){ let j=i; while(j+1<n && order[j+1][0]===order[i][0]) j++;
    const r=(i+j+2)/2; for(let k=i;k<=j;k++) ranks[order[k][1]]=r; i=j+1; }
  let Wp=0,Wm=0; for(let k=0;k<n;k++){ if(d[k]>0)Wp+=ranks[k]; else Wm+=ranks[k]; }
  const W=Math.min(Wp,Wm);
  // rank-biserial correlation
  const rb = (Wp-Wm)/(n*(n+1)/2);
  // normal approximation with continuity + tie correction
  const meanW=n*(n+1)/4;
  // tie correction
  const tieGroups={}; abs.forEach(v=>tieGroups[v]=(tieGroups[v]||0)+1);
  let tieSum=0; for(const v in tieGroups){ const t=tieGroups[v]; tieSum+=t*t*t-t; }
  const varW=(n*(n+1)*(2*n+1)-tieSum/2)/24;
  let z=0,p=1;
  if(varW>0){ z=(W-meanW+0.5)/Math.sqrt(varW); p=2*normCDF(-Math.abs(z)); if(p>1)p=1; }
  return {n,W,Wp,Wm,z,p,rankBiserial:rb};
}

/* ---------- symmetry check to pick the test ---------- */
function looksSymmetric(d){ d=d.filter(isNum); if(d.length<4) return false;
  const m=mean(d), s=sd(d); if(!s) return true;
  // sample skewness
  const g=d.reduce((a,x)=>a+Math.pow((x-m)/s,3),0)*d.length/((d.length-1)*(d.length-2||1));
  return Math.abs(g)<1.0; }

/* ---------- BCa-ish bootstrap CI for the mean difference (percentile fallback) ---------- */
function bootstrapCI(d,iter){ d=d.filter(isNum); const n=d.length; if(n<2) return [null,null];
  iter=iter||3000; const means=[];
  for(let b=0;b<iter;b++){ let s=0; for(let k=0;k<n;k++) s+=d[Math.floor(Math.random()*n)]; means.push(s/n); }
  means.sort((a,b)=>a-b);
  const lo=means[Math.floor(0.025*iter)], hi=means[Math.floor(0.975*iter)];
  return [lo,hi]; }

/* parametric CI for mean diff */
function tCI(d){ d=d.filter(isNum); const n=d.length; if(n<2) return [null,null];
  const m=mean(d), s=sd(d); const se=s/Math.sqrt(n);
  const tc=tCrit(0.975,n-1); return [m-tc*se, m+tc*se]; }
function tCrit(p,df){ // invert tCDF by bisection
  let lo=0,hi=100; for(let k=0;k<80;k++){ const mid=(lo+hi)/2; (tCDF(mid,df)<p)?lo=mid:hi=mid; } return (lo+hi)/2; }

/* ---------- exact binomial sign test (two-sided) ---------- */
function binomTest(k,n,p0){ p0=p0||0.5; if(n===0) return {p:null,prop:null,ci:[null,null]};
  function pmf(i){ return Math.exp(gammaln(n+1)-gammaln(i+1)-gammaln(n-i+1)+i*Math.log(p0)+(n-i)*Math.log(1-p0)); }
  const pk=pmf(k); let p=0; for(let i=0;i<=n;i++){ const pi=pmf(i); if(pi<=pk*1.0000001) p+=pi; }
  if(p>1)p=1;
  // Clopper-Pearson CI
  const prop=k/n; let loB=0,hiB=1;
  if(k>0) loB=betaInv(0.025,k,n-k+1);
  if(k<n) hiB=betaInv(0.975,k+1,n-k);
  return {p, prop, ci:[loB,hiB], k, n}; }
function betaInv(p,a,b){ let lo=0,hi=1; for(let k=0;k<100;k++){ const mid=(lo+hi)/2; (betai(a,b,mid)<p)?lo=mid:hi=mid; } return (lo+hi)/2; }

/* Holm-Bonferroni adjusted p-values */
function holm(pvals){ // pvals: array of {key,p}
  const items=pvals.filter(x=>x.p!=null).slice().sort((a,b)=>a.p-b.p);
  const m=items.length; let prev=0;
  items.forEach((it,i)=>{ let adj=(m-i)*it.p; adj=Math.min(1,Math.max(adj,prev)); prev=adj; it.pHolm=adj; });
  const map={}; items.forEach(it=>map[it.key]=it.pHolm); return map;
}

function conditionSteps(c){
  const S=[];
  S.push({ title:`Before the tasks — ${c}`, render(){ return `
    <p class="lead">You will now use the <b>${condLabel(c)}</b>. ${badge(c)}</p>

    <h3>Controls</h3><ul>${TRAIN[c]}</ul>`; },
    collect(){}, valid(){ return true; }, onLeave(){ startBlockTimer(c); } });
  TASKS.forEach((t,ti)=>{
    S.push({ title:`Task ${t.id} — ${c}`, render(){ return taskStepHTML(t,c); },
      collect(){ const a1=readAnswer(t.answerType,"ans"); const a2=t.answerType2?readAnswer(t.answerType2,"ans2"):undefined;
        state.cond[c].tasks[ti]={id:t.id,answer:a1,answer2:a2}; },
      valid(){ const a1=readAnswer(t.answerType,"ans"); if(a1==null||a1===""){ show("miss-ans"); return false; } return true; },
      onEnter(){ /* timer already running */ } });
  });
  // after last task, mark split
  S.push({ title:`Questionnaire — Usability (${c})`, onEnter(){ markTasksDone(c); },
    render(){ return susHTML(c); }, collect(){ collSUS(c); }, valid(){ return valSUS(c); } });
  S.push({ title:`Questionnaire — Experience (${c})`, render(){ return ueqpHTML(c); }, collect(){ collUEQP(c); }, valid(){ return valUEQP(c); } });
  S.push({ title:`Questionnaire — Workload (${c})`, render(){ return tlxHTML(c); }, collect(){ collTLX(c); }, valid(){ return valTLX(c); } });
  if(c==="VR") S.push({ title:"Questionnaire — Presence (VR)", render(){ return ipqHTML(); }, collect(){ collIPQ(); }, valid(){ return valIPQ(); } });
  // last step of the block stops the timer on leave
  S[S.length-1]._stopAfter=c;
  return S;
}

  q("#progFill").style.width = ((idx)/(steps.length-1)*100)+"%";
  window.scrollTo(0,0);
}
q("#nextBtn").addEventListener("click",()=>{
  const s=steps[idx];
  if(s.collect) s.collect();
  if(s.valid && !s.valid()) return;
  if(s._stopAfter) stopBlockTimer(s._stopAfter);
  if(s.onLeave) s.onLeave();
  if(idx<steps.length-1){ idx++; render(); }
});
q("#backBtn").addEventListener("click",()=>{ if(idx>0){ idx--; render(); } });
render();
</script></body></html>
